<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proteus</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Fő menü">
    <div class="brand">
      <img src="logo.png" alt="">
      <div>
        <div class="brand-name">Proteus</div>
        <div class="brand-version" id="version"></div>
      </div>
    </div>
    <button class="nav" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Főoldal</button>
    <button class="nav" data-route="skins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Skinek</button>
    <button class="nav" data-route="mods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Saját skinek</button>
    <button class="nav" data-route="tier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tier list</button>
    <button class="nav" data-route="patch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Patch notes</button>
    <button class="nav" data-route="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
    <button class="nav" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Beállítások</button>
    <div class="side-spacer"></div>
    <div class="client-box" aria-live="polite">
      <div class="client-row"><span class="dot" id="client-dot"></span><span id="client-text">League kliens…</span></div>
      <div class="client-phase" id="client-phase"></div>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
