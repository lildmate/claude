name: Party relay

# Deploys the party mode relay (relay-worker/) to Cloudflare Workers.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown in the Cloudflare dashboard
#
# The relay's address (wss://proteus-party-relay.<subdomain>.workers.dev) then
# goes into the RELAY_URL secret, which the Release workflow builds into
# Proteus. See SAJAT_VERZIO.md.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - relay-worker/**
      - .github/workflows/relay.yml

permissions: {}

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash  # with pipefail, so a failed deploy fails the step despite tee
        working-directory: relay-worker
    steps:
      - name: Check that the Cloudflare secrets are set
        id: secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: skipping the deploy (see SAJAT_VERZIO.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "24"

      - name: Install wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -n "$url" ]; then
            wss="wss://${url#https://}"
            echo "::notice title=Relay address::$wss  -> put this into the RELAY_URL repository secret"
            {
              echo "### Party relay deployed"
              echo
              echo "Put this into the \`RELAY_URL\` repository secret:"
              echo
              echo "\`$wss\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
